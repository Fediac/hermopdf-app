<section class="section cta-section">
  <div class="wrap">
    <div class="cta-band">
      <div class="mascot-mini">{{> mascot}}</div>
      <div>
        <h2>{{t:ctaTitle}}</h2>
        <p>{{t:ctaText}}</p>
      </div>
      <div class="actions">
        <a class="btn btn-primary btn-lg btn-stack" href="{{url:download}}" data-gc="cta-download">{{t:ctaDownload}}<span class="sub">{{t:ctaDownloadSub}}</span></a>
        <a class="btn btn-ghost" href="{{url:pricing}}">{{t:ctaSecondary}}</a>
      </div>
    </div>
  </div>
</section>
