<header class="site-header" id="top">
  <div class="wrap header-row">
    <a class="brand" href="{{url:home}}" aria-label="{{t:homeLabel}}">{{> logo}}<span>Hermo<b>PDF</b></span></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav"><span class="burger" aria-hidden="true"></span><span class="sr">{{t:menu}}</span></button>
    <nav class="site-nav" id="site-nav" aria-label="{{t:menu}}">
      <a href="{{url:compress}}"{{current:compress}}>{{t:navCompress}}</a>
      <a href="{{url:home}}#features">{{t:navFeatures}}</a>
      <a href="{{url:compare}}"{{current:compare}}>{{t:navCompare}}</a>
      <a href="{{url:pricing}}"{{current:pricing}}>{{t:navPricing}}</a>
      <a href="{{url:faq}}"{{current:faq}}>{{t:navFaq}}</a>
      <a href="{{url:support}}"{{current:support}}>{{t:navSupport}}</a>
      <a class="btn btn-primary btn-sm" href="{{url:download}}">{{t:navDownload}}</a>
    </nav>
    {{langmenu}}
    <button class="theme-btn" type="button" data-to-dark="{{t:themeToDark}}" data-to-light="{{t:themeToLight}}" aria-label="{{t:themeToDark}}" title="{{t:themeToDark}}"><svg class="i-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7 7 17M17 7l1.7-1.7"/></g></svg><svg class="i-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M20.2 14.6A8.5 8.5 0 0 1 9.4 3.8a8.5 8.5 0 1 0 10.8 10.8Z" fill="currentColor"/></svg></button>
  </div>
</header>
